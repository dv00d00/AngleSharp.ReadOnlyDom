<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RODOM streaming Markdown fold</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="eyebrow">Bounded UTF-8 streaming fold</div>
    <h1>HTML bytes → Markdown bytes</h1>
    <p>Paste HTML. The sample sends that body directly through the streaming query plan—no remote fetcher or proxy.</p>
  </header>

  <main>
    <form id="convert-form">
      <section class="pane">
        <div class="pane-title">
          <span>HTML input</span>
          <button type="submit">Convert</button>
        </div>
        <textarea id="html" spellcheck="false"><html><body><article>
  <h1>Hello</h1>
  <p>HTML bytes become <strong>Markdown</strong>.</p>
  <ul><li>Bounded input</li><li>Backpressured output</li></ul>
</article></body></html></textarea>
      </section>
    </form>

    <p id="status" role="status">Ready.</p>

    <section class="pane output-pane">
      <div class="pane-title"><span>Markdown output</span></div>
      <textarea id="markdown" spellcheck="false" readonly></textarea>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
